syntax = "proto3";

package trains.io.z21.simctl.v1;

option go_package = "github.com/trains-io/z21-sim/api/simctl/v1;simctlv1";

import "google/protobuf/timestamp.proto";

// SimulatorService is the gRPC control plane for z21-sim.
// A sidecar (z21-sim-controller) uses it to inject unsolicited Z21 LAN events.
service SimulatorService {
  // BroadcastSystemState emits LAN_SYSTEMSTATE_DATACHANGED to subscribed clients.
  rpc BroadcastSystemState(BroadcastSystemStateRequest) returns (BroadcastSystemStateResponse);

  // SetTrackPower updates simulator track power and emits unsolicited XpressNet
  // and system-state broadcasts to subscribed clients. Switching it on also
  // ends an emergency stop and a short circuit.
  rpc SetTrackPower(SetTrackPowerRequest) returns (SetTrackPowerResponse);

  // NotifyCANDeviceDetected registers a CAN device and broadcasts its initial
  // status to subscribed clients, emulating hot-plug detection.
  rpc NotifyCANDeviceDetected(NotifyCANDeviceDetectedRequest) returns (NotifyCANDeviceDetectedResponse);

  // InjectRaw sends raw Z21 datasets in one packet to the clients subscribed
  // to any bit of broadcast_flags, for events the other RPCs do not cover. The
  // simulator state does not change.
  rpc InjectRaw(InjectRawRequest) returns (InjectRawResponse);

  // ListClients returns the Z21 LAN clients with an active session, ordered
  // by address.
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);

  // SetSystemState changes the measured values the simulator reports in
  // LAN_SYSTEMSTATE_DATACHANGED. Only the fields that are set change; if that
  // changes the reported state, system-state subscribers get the new system
  // state. While track power is off, the currents and the VCC voltage are
  // reported as zero; values set meanwhile are reported once power is on.
  rpc SetSystemState(SetSystemStateRequest) returns (SetSystemStateResponse);

  // EmergencyStop stops all locos, like LAN_X_SET_STOP; the track voltage
  // stays as it is. If no emergency stop was active, X-Bus subscribers get
  // LAN_X_BC_STOPPED and LAN_X_STATUS_CHANGED, and system-state subscribers
  // the new system state. SetTrackPower with on = true ends it.
  rpc EmergencyStop(EmergencyStopRequest) returns (EmergencyStopResponse);

  // ShortCircuit reports a short circuit, which switches the track voltage
  // off. If that changes the state, X-Bus subscribers get
  // LAN_X_BC_TRACK_SHORT_CIRCUIT and LAN_X_STATUS_CHANGED, and system-state
  // subscribers the new system state, whose CentralStateEx tells internal and
  // external shorts apart. SetTrackPower with on = true ends it.
  rpc ShortCircuit(ShortCircuitRequest) returns (ShortCircuitResponse);

  // SetLoco changes a loco as a throttle outside the Z21 LAN would. Only the
  // fields that are set change. If the loco changed, the clients subscribed
  // to it get LAN_X_LOCO_INFO.
  rpc SetLoco(SetLocoRequest) returns (SetLocoResponse);
}

// LocoSpeedSteps is the speed step mode of a loco.
enum LocoSpeedSteps {
  LOCO_SPEED_STEPS_UNSPECIFIED = 0;
  LOCO_SPEED_STEPS_14 = 1;
  LOCO_SPEED_STEPS_28 = 2;
  LOCO_SPEED_STEPS_128 = 3;
}

message SetLocoRequest {
  // Loco address, 1–9999.
  uint32 address = 1;
  // New speed step mode. Without speed, the loco keeps its speed step,
  // which must exist in the new mode, or its emergency stop.
  optional LocoSpeedSteps speed_steps = 2;
  // Speed step: 0 stops, at most 14, 28 or 126 depending on the speed step
  // mode. Ends an emergency stop.
  optional uint32 speed = 3;
  // Direction.
  optional bool forward = 4;
  // Functions to switch, by number (F0–F31): true is on, false off.
  map<uint32, bool> functions = 5;
}

message SetLocoResponse {
  // The loco after the change.
  Loco loco = 1;
  // Whether the loco changed.
  bool changed = 2;
  int32 recipient_count = 3;
}

// Loco is the state of a loco, as reported in LAN_X_LOCO_INFO.
message Loco {
  uint32 address = 1;
  LocoSpeedSteps speed_steps = 2;
  // Speed step, 0 when stopped or in an emergency stop.
  uint32 speed = 3;
  bool emergency_stop = 4;
  bool forward = 5;
  // Functions that are on, F0 in bit 0 up to F31 in bit 31.
  uint32 functions = 6;
}

// ShortCircuitKind tells where a short circuit happened.
enum ShortCircuitKind {
  // Treated as SHORT_CIRCUIT_KIND_INTERNAL.
  SHORT_CIRCUIT_KIND_UNSPECIFIED = 0;
  // On the Z21's own main or programming track output.
  SHORT_CIRCUIT_KIND_INTERNAL = 1;
  // On the output of an external booster.
  SHORT_CIRCUIT_KIND_EXTERNAL = 2;
}

message ShortCircuitRequest {
  ShortCircuitKind kind = 1;
}

message ShortCircuitResponse {
  // Whether the state changed: no short circuit of this kind was active.
  bool changed = 1;
}

message EmergencyStopRequest {}

message EmergencyStopResponse {
  // Whether no emergency stop was active before.
  bool changed = 1;
}

message BroadcastSystemStateRequest {}

message BroadcastSystemStateResponse {
  int32 recipient_count = 1;
}

message SetTrackPowerRequest {
  bool on = 1;
}

message SetTrackPowerResponse {
  bool on = 1;
  bool changed = 2;
}

enum CANDeviceKind {
  CAN_DEVICE_KIND_UNSPECIFIED = 0;
  CAN_DEVICE_KIND_DETECTOR = 1;
  CAN_DEVICE_KIND_BOOSTER = 2;
}

message NotifyCANDeviceDetectedRequest {
  uint32 net_id = 1;
  CANDeviceKind kind = 2;
  string name = 3;
  uint32 module_addr = 4;  // detector: 1-based module address (default 1)
  uint32 port_count = 5;   // detector: number of feedback ports (default 1)
  uint32 output_port = 6;  // booster: output port index (default 1)
}

message NotifyCANDeviceDetectedResponse {
  int32 recipient_count = 1;
}

message InjectRawRequest {
  // One or more complete datasets as on the wire: 2-byte little-endian
  // length, 2-byte header, data.
  bytes payload = 1;
  // Broadcast flags (Z21 LAN spec §2.16, for example 0x00000001 for X-Bus);
  // must not be zero.
  uint32 broadcast_flags = 2;
}

message InjectRawResponse {
  int32 recipient_count = 1;
}

message ListClientsRequest {}

message ListClientsResponse {
  repeated Client clients = 1;
}

// SetSystemStateRequest holds the values to change (Z21 LAN spec §2.18).
// Signed values must fit in int16, unsigned values in uint16.
message SetSystemStateRequest {
  // Current on the main track, mA.
  optional int32 main_current_ma = 1;
  // Current on the programming track, mA.
  optional int32 prog_current_ma = 2;
  // Smoothed current on the main track, mA.
  optional int32 filtered_main_current_ma = 3;
  // Internal temperature, °C.
  optional int32 temperature_c = 4;
  // Supply voltage, mV.
  optional uint32 supply_voltage_mv = 5;
  // Internal voltage, identical to track voltage, mV.
  optional uint32 vcc_voltage_mv = 6;
}

message SetSystemStateResponse {
  // Whether the reported system state changed.
  bool changed = 1;
  int32 recipient_count = 2;
}

// Client is the session of a Z21 LAN client.
message Client {
  // Client UDP address, "ip:port".
  string addr = 1;
  // Simulator socket the client last sent to, "ip:port" (port 21105 or 21106).
  string local_addr = 2;
  // Broadcast flags set with LAN_SET_BROADCASTFLAGS (Z21 LAN spec §2.16).
  uint32 broadcast_flags = 3;
  // Loco addresses subscribed with LAN_X_GET_LOCO_INFO, oldest first (at most 16).
  repeated uint32 locos = 4;
  // Last packet received from the client; the session ends after one minute
  // of silence.
  google.protobuf.Timestamp last_seen = 5;
}
