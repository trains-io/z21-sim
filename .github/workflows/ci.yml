name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Unit tests
        run: go test ./... -count=1

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build test image
        run: docker build -t z21-sim-go:ci .

      - name: Integration tests
        env:
          Z21_TESTSERVER_IMAGE: z21-sim-go:ci
        run: go test -tags=integration ./integration/... -count=1 -timeout=10m

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Docker image builds
        run: docker build -t z21-sim-go:ci .
